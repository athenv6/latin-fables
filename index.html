<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Latin Fables</title>

  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'MedievalSharp', cursive;
      background-image: url("https://bestiary.ca/beastimage/minimg100410.jpg");
      background-size: cover;
    }

    .container {
      background: rgba(255,255,255,0.85);
      padding: 40px;
      border-radius: 10px;
      text-align: center;
    }

    input {
      padding: 10px;
      width: 220px;
    }

    button {
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Latin Fable Collection</h1>

    <p>Search by number or title</p>

    <input id="searchBox" placeholder="Type 1">
    <button onclick="searchFable()">Search</button>

  </div>

  <script>
    function searchFable() {
      const input = document.getElementById("searchBox").value.trim();

      if (input === "1") {
        window.location.href = "fable.html?id=1";
      } else {
        alert("Try 1");
      }
    }
  </script>

</body>
</html>
