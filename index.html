<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Latin Fable Collection</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;

      font-family: 'MedievalSharp', cursive;

      /* background image */
      background-image: url("https://bestiary.ca/beastimage/minimg100410.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .container {
      background: rgba(255, 255, 255, 0.85);
      padding: 40px;
      border-radius: 10px;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 220px;
    }

    button {
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Latin Fable Collection</h1>

  <p>Search by fable number or title</p>

  <input type="text" id="searchBox" placeholder="1 or De gallo et iaspide">
  <button onclick="goToFable()">Search</button>
</div>

<script>
function goToFable() {
  let input = document.getElementById("searchBox").value.toLowerCase().trim();

  if (input === "1" || input.includes("gallo") || input.includes("iaspide")) {
    window.location.href = "fable1.html";
  } else {
    alert("Fable not found. Try: 1 or De gallo et iaspide");
  }
}
</script>

</body>
</html>
