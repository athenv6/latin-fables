<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'MedievalSharp', cursive;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background: #f5f5f5;
}

.box {
  text-align: center;
  background: white;
  padding: 30px;
  border-radius: 10px;
  width: 420px;
}

input {
  padding: 5px;
  margin: 5px;
  width: 200px;
}

button {
  margin-top: 10px;
  padding: 8px 15px;
  cursor: pointer;
}

.result {
  margin-top: 15px;
  text-align: left;
}
</style>
</head>

<body>

<div class="box">

<h2>Fable Quiz</h2>

<p>fimum → <input id="f1"></p>
<p>escam → <input id="f2"></p>
<p>iaspis → <input id="f3"></p>
<p>sorde → <input id="f4"></p>
<p>messis → <input id="f5"></p>

<button onclick="check()">Check</button>

<div id="result" class="result"></div>

</div>

<script>
function check() {

const answers = [
  ["f1", "terram"],
  ["f2", "cibum"],
  ["f3", "sapientia"],
  ["f4", "immunditia"],
  ["f5", "fructus"]
];

let output = "";
let score = 0;

for (let i = 0; i < answers.length; i++) {

let id = answers[i][0];
let correct = answers[i][1];
let val = document.getElementById(id).value.trim().toLowerCase();

if (val === correct) {
  output += "✔ " + id + " correct<br>";
  score++;
} else {
  output += "❌ " + id + " wrong → correct: " + correct + "<br>";
}

}

output += "<br><b>Score: " + score + "/5</b>";

document.getElementById("result").innerHTML = output;
}
</script>

</body>
</html>
